name: Build & Release MSIX

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    env:
      CONFIGURATION: Release
      PLATFORM: x64
      VERSION: 1.0.${{ github.run_number }}.0
      TAG: v1.0.${{ github.run_number }}
      MANIFEST: NetFreeBoardWidgetPackage/Package.appxmanifest
      PKG_DIR: ${{ github.workspace }}\AppPackages
      OUT_DIR: ${{ github.workspace }}\release-out
      # Stable addresses: the installer and every installed copy look for updates at the latest release.
      LATEST_URL: https://github.com/${{ github.repository }}/releases/latest/download
      TAG_URL: https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # One fixed certificate for every release (and every widget of this publisher): users trust it once,
      # through the installer, and later updates install silently.
      - name: Load signing certificate
        id: cert
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64 -or -not $env:SIGNING_PFX_PASSWORD) {
            throw 'Secrets SIGNING_PFX_BASE64 / SIGNING_PFX_PASSWORD are not set for this repository.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $cert = New-Object Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:SIGNING_PFX_PASSWORD)
          Write-Host "Certificate: $($cert.Subject)  $($cert.Thumbprint)  until $($cert.NotAfter)"

          # Public part: embedded in the installer and published for manual installs.
          New-Item -ItemType Directory -Force $env:OUT_DIR | Out-Null
          $cer = $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          [IO.File]::WriteAllBytes('Installer/signing.cer', $cer)
          [IO.File]::WriteAllBytes((Join-Path $env:OUT_DIR 'NetFreeWidget.cer'), $cer)

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          Write-Host "signtool: $($signtool.FullName)"

          "subject=$($cert.Subject)" >> $env:GITHUB_OUTPUT
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Set package version and read Publisher
        id: manifest
        env:
          CERT_SUBJECT: ${{ steps.cert.outputs.subject }}
        run: |
          $path = $env:MANIFEST
          $text = Get-Content $path -Raw -Encoding utf8
          $regex = [regex]'(<Identity\b[^>]*?\bVersion=")[^"]*(")'
          if (-not $regex.IsMatch($text)) { throw "Identity Version not found in $path" }
          $text = $regex.Replace($text, "`${1}$env:VERSION`${2}", 1)
          Set-Content $path $text -Encoding utf8 -NoNewline

          $xml = [xml]$text
          $publisher = $xml.Package.Identity.Publisher
          if (-not $publisher) { throw "Identity Publisher not found in $path" }
          if ($publisher -ne $env:CERT_SUBJECT) {
            throw "Manifest Publisher '$publisher' must equal the certificate subject '$env:CERT_SUBJECT'."
          }
          Write-Host "Version:   $($xml.Package.Identity.Version)"
          Write-Host "Publisher: $publisher"
          "publisher=$publisher" >> $env:GITHUB_OUTPUT
          "name=$($xml.Package.Identity.Name)" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: msbuild NetFreeWidget.sln /t:Restore /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM /v:minimal

      - name: Build MSIX
        run: >
          msbuild NetFreeWidget.sln
          /p:Configuration=$env:CONFIGURATION
          /p:Platform=$env:PLATFORM
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=false
          /p:AppxPackageDir=$env:PKG_DIR\
          /v:minimal

      - name: Build installer
        run: |
          dotnet build Installer/WidgetSetup.csproj -c Release -o "$env:RUNNER_TEMP\setup"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed ($LASTEXITCODE)" }
          Copy-Item "$env:RUNNER_TEMP\setup\NetFreeWidget-Setup.exe" $env:OUT_DIR

      - name: Collect package files
        id: collect
        run: |
          $msix = Get-ChildItem $env:PKG_DIR -Recurse -Filter *.msix |
            Where-Object { $_.FullName -notmatch '\\Dependencies\\' } |
            Select-Object -First 1
          if (-not $msix) { throw "No .msix produced under $env:PKG_DIR" }

          $target = Join-Path $env:OUT_DIR "NetFreeWidget_$($env:VERSION)_$($env:PLATFORM).msix"
          Copy-Item $msix.FullName $target
          "msix=$target" >> $env:GITHUB_OUTPUT

          # Framework dependencies (Windows App Runtime, VCLibs) for the target platform, if generated.
          $deps = Get-ChildItem $env:PKG_DIR -Recurse -Include *.msix, *.appx |
            Where-Object { $_.FullName -match "\\Dependencies\\$($env:PLATFORM)\\" }
          foreach ($d in $deps) {
            Copy-Item $d.FullName (Join-Path $env:OUT_DIR "Dependency_$($d.Name)")
          }

          # Manual fallback for machines where the installer does not run; the widget still updates itself.
          Copy-Item .github/scripts/install.ps1 $env:OUT_DIR

      - name: Sign
        env:
          PFX: ${{ steps.cert.outputs.pfx }}
          SIGNTOOL: ${{ steps.cert.outputs.signtool }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          MSIX: ${{ steps.collect.outputs.msix }}
        run: |
          # Timestamped, so packages stay installable after the certificate expires; retry on flaky servers.
          $servers = 'http://timestamp.digicert.com', 'http://timestamp.sectigo.com', 'http://timestamp.globalsign.com/tsa/r6advanced1'
          foreach ($file in $env:MSIX, (Join-Path $env:OUT_DIR 'NetFreeWidget-Setup.exe')) {
            $signed = $false
            foreach ($ts in $servers) {
              & $env:SIGNTOOL sign /fd SHA256 /f $env:PFX /p $env:SIGNING_PFX_PASSWORD /tr $ts /td SHA256 $file
              if ($LASTEXITCODE -eq 0) { $signed = $true; break }
              Write-Host "Signing with timestamp server $ts failed; trying the next one."
            }
            if (-not $signed) { throw "signtool failed for $file" }
          }

      - name: Write .appinstaller
        env:
          PUBLISHER: ${{ steps.manifest.outputs.publisher }}
          PACKAGE_NAME: ${{ steps.manifest.outputs.name }}
          MSIX: ${{ steps.collect.outputs.msix }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Get-Identity($file) {
            $zip = [IO.Compression.ZipFile]::OpenRead($file)
            try {
              $reader = New-Object IO.StreamReader($zip.GetEntry('AppxManifest.xml').Open())
              return ([xml]$reader.ReadToEnd()).Package.Identity
            }
            finally { $zip.Dispose() }
          }
          function Esc($s) { [Security.SecurityElement]::Escape($s) }

          $deps = foreach ($d in Get-ChildItem $env:OUT_DIR -Filter 'Dependency_*') {
            $id = Get-Identity $d.FullName
            "    <Package Name=""$(Esc $id.Name)"" Publisher=""$(Esc $id.Publisher)"" Version=""$($id.Version)"" ProcessorArchitecture=""$($id.ProcessorArchitecture)"" Uri=""$env:TAG_URL/$($d.Name)"" />"
          }

          $msixName = Split-Path $env:MSIX -Leaf
          $xml = @(
            '<?xml version="1.0" encoding="utf-8"?>'
            "<AppInstaller xmlns=""http://schemas.microsoft.com/appx/appinstaller/2021"" Version=""$env:VERSION"" Uri=""$env:LATEST_URL/NetFreeWidget.appinstaller"">"
            "  <MainPackage Name=""$(Esc $env:PACKAGE_NAME)"" Publisher=""$(Esc $env:PUBLISHER)"" Version=""$env:VERSION"" ProcessorArchitecture=""$env:PLATFORM"" Uri=""$env:TAG_URL/$msixName"" />"
            if ($deps) { '  <Dependencies>'; $deps; '  </Dependencies>' }
            '  <UpdateSettings>'
            '    <OnLaunch HoursBetweenUpdateChecks="0" />'
            '    <AutomaticBackgroundTask />'
            '  </UpdateSettings>'
            '</AppInstaller>'
          ) -join "`n"
          $out = Join-Path $env:OUT_DIR 'NetFreeWidget.appinstaller'
          Set-Content $out $xml -Encoding utf8 -NoNewline
          Get-Content $out
          Get-ChildItem $env:OUT_DIR | Format-Table Name, Length

      # Nothing is published unless a clean machine can install it through the installer and then update.
      - name: Test install and automatic update (local feed)
        shell: powershell
        env:
          PFX: ${{ steps.cert.outputs.pfx }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: >
          .github/scripts/test-install.ps1 -Mode Local -Version $env:VERSION -ReleaseDir $env:OUT_DIR
          -Pfx $env:PFX -PfxPassword $env:SIGNING_PFX_PASSWORD

      - name: Remove signing key
        if: always()
        env:
          PFX: ${{ steps.cert.outputs.pfx }}
        run: if ($env:PFX -and (Test-Path $env:PFX)) { Remove-Item $env:PFX -Force }

      - name: Write release notes
        run: |
          $msg = git log -1 --pretty=format:%B
          $notes = @(
            "## גרסה $env:VERSION"
            ''
            '### שינויים'
            $msg
            ''
            '### התקנה ראשונה'
            "להוריד ולהריץ את [NetFreeWidget-Setup.exe]($env:LATEST_URL/NetFreeWidget-Setup.exe)."
            'המתקין מבקש אישור מנהל פעם אחת (להתקנת תעודת החתימה), מתקין את הווידג''ט ורושם עדכונים אוטומטיים.'
            'אם Windows מציג "Windows protected your PC": "More info" ← "Run anyway".'
            ''
            '### עדכונים'
            'הווידג''ט מתעדכן מעצמו כשיוצאת גרסה חדשה, גם ברשתות מסוננות; אין צורך להוריד כלום.'
            ''
            '### התקנה ידנית'
            'להוריד את כל הקבצים לאותה תיקייה ולהריץ PowerShell: `powershell -ExecutionPolicy Bypass -File .\install.ps1`'
            ''
            "Commit: $env:GITHUB_SHA"
          )
          $notes -join "`n" | Set-Content (Join-Path $env:RUNNER_TEMP 'notes.md') -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: גרסה ${{ env.TAG }}
          body_path: ${{ runner.temp }}/notes.md
          files: release-out/*
          fail_on_unmatched_files: true
          make_latest: true

  # The published release, exactly as users get it: real GitHub URLs, upgrade from the previous release,
  # and a fresh install through the downloaded installer.
  verify-release:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test the published release
        shell: powershell
        run: >
          .github/scripts/test-install.ps1 -Mode Remote -Version 1.0.${{ github.run_number }}.0
          -Repository ${{ github.repository }}
